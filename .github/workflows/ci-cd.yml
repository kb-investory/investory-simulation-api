name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: investory-simulation-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Verify app imports
        run: python -c "import app.main"

  build-and-push:
    name: Build & push image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Resolve image tag
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ github.repository_owner }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_latest=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            --provenance=false \
            --sbom=false \
            -t ${{ steps.meta.outputs.image }} \
            -t ${{ steps.meta.outputs.image_latest }} \
            .

      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.image }}
          docker push ${{ steps.meta.outputs.image_latest }}

  deploy:
    name: Deploy to VM
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/463680495848/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: deploy-bot@kbinvestory.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via docker compose on GCP VM (IAP + OS Login)
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          gcloud compute ssh investory-api-simulation-server \
            --project=kbinvestory \
            --zone=asia-northeast3-c \
            --tunnel-through-iap \
            --command="
              set -e
              echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin
              cd '${{ secrets.DEPLOY_PATH }}'
              IMAGE='$IMAGE' docker compose pull
              IMAGE='$IMAGE' docker compose up -d

              ready=0
              for i in \$(seq 1 30); do
                if docker compose exec -T api python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)\" > /dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ \"\$ready\" -ne 1 ]; then
                echo 'App did not become ready in time' >&2
                docker compose logs --tail=50
                exit 1
              fi

              docker image prune -f
            "
